<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu — Customer Ordering System</title>

  <style>
    :root {
      --bg:         #f7f4ef;
      --surface:    #ffffff;
      --border:     #e8e2d9;
      --accent:     #c8401a;
      --accent-dk:  #a33315;
      --text-main:  #1a1510;
      --text-sub:   #6b6256;
      --badge-ok:   #d4edda;
      --badge-ok-t: #276237;
      --badge-no:   #f0e8e8;
      --badge-no-t: #8c2a2a;
      --radius:     10px;
      --shadow:     0 2px 12px rgba(0,0,0,.07);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--text-main);
      color: #f7f4ef;
      padding: 28px 32px 22px;
      display: flex;
      align-items: baseline;
      gap: 14px;
    }
    header h1 { font-size: 1.75rem; font-weight: normal; letter-spacing: .02em; }
    header span { font-size: .9rem; opacity: .55; font-style: italic; }

    /* ── Search ── */
    .search-bar {
      max-width: 960px;
      margin: 28px auto 0;
      padding: 0 20px;
    }
    .search-bar label {
      display: block;
      font-size: .78rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--text-sub);
      margin-bottom: 8px;
    }
    .search-bar input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      font-size: 1rem;
      font-family: inherit;
      color: var(--text-main);
      outline: none;
      transition: border-color .2s;
    }
    .search-bar input:focus { border-color: var(--accent); }

    /* ── Notification ── */
    #cart-message {
      max-width: 960px;
      margin: 14px auto 0;
      padding: 11px 16px;
      border-radius: var(--radius);
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text-main);
      text-align: center;
      display: none;
      font-size: .93rem;
    }
    #cart-message.success {
      display: block; border-color: #b9d8c0;
      background: #edf7ef; color: #276237;
    }
    #cart-message.error {
      display: block; border-color: #e0b8b8;
      background: #f8eeee; color: #8c2a2a;
    }

    /* ── Promo ── */
    .promo-box {
      max-width: 960px;
      margin: 10px auto 0;
      padding: 0 20px;
      display: flex;
      gap: 10px;
    }
    .promo-box input {
      flex: 1;
      padding: 11px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      font-size: .93rem;
      font-family: inherit;
      color: var(--text-main);
      outline: none;
      transition: border-color .2s;
    }
    .promo-box input::placeholder { color: var(--text-sub); font-style: italic; }
    .promo-box input:focus { border-color: var(--accent); }
    .promo-box button {
      padding: 11px 22px;
      border: none;
      border-radius: var(--radius);
      background: var(--text-main);
      color: #f7f4ef;
      font-size: .85rem;
      font-family: inherit;
      letter-spacing: .06em;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
      transition: background .18s;
    }
    .promo-box button:hover { background: var(--accent-dk); }
    .promo-box button:disabled { background: var(--border); color: var(--text-sub); cursor: not-allowed; }

    /* ── Page layout ── */
    .page-body {
      max-width: 1160px;
      margin: 0 auto;
      padding: 32px 20px 60px;
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 28px;
      align-items: start;
    }
    @media (max-width: 800px) {
      .page-body { grid-template-columns: 1fr; }
      .cart-panel { order: -1; }
    }

    #status-message {
      text-align: center; padding: 48px 0;
      color: var(--text-sub); font-style: italic; font-size: 1.05rem;
    }

    /* ── Category ── */
    .category-section { margin-bottom: 40px; }
    .category-title {
      font-size: 1.05rem; letter-spacing: .12em;
      text-transform: uppercase; color: var(--text-sub);
      border-bottom: 1.5px solid var(--border);
      padding-bottom: 8px; margin-bottom: 18px;
    }
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 18px;
    }

    /* ── Item Card ── */
    .item-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform .18s, box-shadow .18s;
    }
    .item-card:hover:not(.unavailable) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,.1);
    }
    .item-card.unavailable { opacity: .65; }

    /* ── Photo ── */
    .item-photo {
      width: 100%; height: 140px;
      object-fit: cover; display: block;
      background: #ece8e1;
    }
    .item-photo-placeholder {
      width: 100%; height: 140px;
      background: linear-gradient(135deg, #ece8e1 0%, #ddd8d0 100%);
      display: flex; align-items: center;
      justify-content: center;
      font-size: 2rem;
    }

    /* ── Card body ── */
    .item-body {
      padding: 14px 14px 12px;
      display: flex; flex-direction: column;
      gap: 7px; flex: 1;
    }
    .item-name { font-size: 1rem; font-weight: bold; line-height: 1.3; }
    .item-price { font-size: .97rem; color: var(--accent); }

    .badge {
      display: inline-block;
      font-size: .7rem; letter-spacing: .06em;
      text-transform: uppercase; font-family: Arial, sans-serif;
      padding: 3px 10px; border-radius: 20px; align-self: flex-start;
    }
    .badge.available   { background: var(--badge-ok);  color: var(--badge-ok-t); }
    .badge.unavailable { background: var(--badge-no); color: var(--badge-no-t); }

    /* ── Qty stepper ── */
    .qty-row {
      display: flex; align-items: center;
      gap: 0; margin-top: 2px;
    }
    .qty-btn {
      width: 28px; height: 28px;
      border: 1.5px solid var(--border);
      border-radius: 6px; background: var(--bg);
      color: var(--text-main); font-size: 1.05rem;
      cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      transition: background .15s; flex-shrink: 0;
    }
    .qty-btn:hover { background: var(--border); }
    .qty-display {
      flex: 1; text-align: center;
      font-size: .92rem; font-weight: bold; color: var(--text-main);
    }

    /* ── Add to Cart btn ── */
    .btn-cart {
      margin-top: auto; padding: 10px 0;
      border: none; border-radius: var(--radius);
      background: var(--accent); color: #fff;
      font-size: .9rem; font-family: inherit;
      cursor: pointer; transition: background .18s;
    }
    .btn-cart:hover:not(:disabled) { background: var(--accent-dk); }
    .btn-cart:disabled {
      background: var(--border); color: var(--text-sub); cursor: not-allowed;
    }

    .no-results {
      text-align: center; color: var(--text-sub);
      font-style: italic; padding: 28px 0;
    }

    /* ── Cart sidebar ── */
    .cart-panel {
      position: sticky; top: 20px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px 18px;
    }
    .cart-panel h2 {
      font-size: .95rem; letter-spacing: .1em;
      text-transform: uppercase; color: var(--text-sub);
      border-bottom: 1.5px solid var(--border);
      padding-bottom: 10px; margin-bottom: 14px;
      font-weight: normal;
    }
    #cart-items-list {
      list-style: none; display: flex;
      flex-direction: column; gap: 9px; min-height: 44px;
      padding: 0; margin: 0;
    }
    .cart-empty-msg {
      color: var(--text-sub); font-style: italic;
      font-size: .85rem; text-align: center; padding: 4px 0;
    }
    .cart-line {
      display: flex; justify-content: space-between;
      align-items: flex-start; font-size: .87rem; gap: 6px;
    }
    .cart-line-name  { flex: 1; color: var(--text-main); line-height: 1.3; }
    .cart-line-meta  { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
    .cart-line-qty   { color: var(--text-sub); font-size: .8rem; font-family: Arial, sans-serif; }
    .cart-line-price { color: var(--accent); font-weight: bold; font-size: .87rem; }
    .cart-divider { border: none; border-top: 1.5px solid var(--border); margin: 12px 0 9px; }
    .cart-total-row {
      display: flex; justify-content: space-between;
      font-size: .97rem; font-weight: bold;
    }
    .cart-total-row span:last-child { color: var(--accent); }
    .cart-discount-row {
      display: none; justify-content: space-between;
      font-size: .82rem; color: #276237; margin-top: 4px;
      font-family: Arial, sans-serif;
    }
    .cart-discount-row.visible { display: flex; }
    .clear-cart-btn {
      margin-top: 10px; width: 100%; padding: 8px 0;
      border: 1.5px solid var(--border); border-radius: var(--radius);
      background: transparent; color: var(--text-sub);
      font-size: .8rem; font-family: inherit; cursor: pointer;
      transition: border-color .18s, color .18s;
    }
    .clear-cart-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.checkout-btn {
  margin-top: 10px;
  width: 100%;
  padding: 10px 0;
  border: none;
  border-radius: var(--radius);
  background: var(--accent);
  color: #fff;
  font-size: .9rem;
  font-family: inherit;
  cursor: pointer;
  transition: background .18s;
}

.checkout-btn:hover {
  background: var(--accent-dk);
}
  </style>
</head>
<body>

  <header>
    <h1>Our Menu</h1>
    <span>Customer Ordering System</span>
  </header>

  <div class="search-bar">
    <label for="search-input">Search items</label>
    <input
      type="text" id="search-input"
      placeholder="e.g. Shawarma, Cola…"
      aria-label="Search menu items"
    />
  </div>

  <div id="cart-message"></div>

  <div class="promo-box">
    <input type="text" id="promo-input"
      placeholder="Enter promo code e.g. SAVE10"
      aria-label="Promo code" />
    <button id="apply-promo-btn">Apply Promo</button>
  </div>

  <div class="page-body">

    <div id="menu-container">
      <p id="status-message">Loading menu…</p>
    </div>

    <aside class="cart-panel">
  <h2>Your Order</h2>

  <ul id="cart-items-list">
    <li class="cart-empty-msg">No items added yet.</li>
  </ul>

  <hr class="cart-divider" />

  <div class="cart-total-row">
    <span>Total</span>
    <span id="cart-total-display">$0.00</span>
  </div>

  <div class="cart-discount-row" id="cart-discount-row">
    <span>Promo discount</span>
    <span id="cart-discount-display"></span>
  </div>

  <button class="clear-cart-btn" id="clear-cart-btn">
    Clear order
  </button>

  <button class="checkout-btn" id="checkout-btn">
    Go to Checkout
  </button>
  </aside>

  </div>

 <script>
  let allCategories = [];
  const SESSION_ID = "browser_session";
  const orderMap = {};
  let appliedDiscount = 0;

  function showCartMessage(message, type) {
    const box = document.getElementById("cart-message");
    if (!box) return;
    box.textContent = message;
    box.className = type;
  }

  function getCartSubtotal() {
    return Object.values(orderMap).reduce(
      (sum, { item, quantity }) => sum + item.price * quantity,
      0
    );
  }

  function renderCartPanel() {
    const list = document.getElementById("cart-items-list");
    const totalEl = document.getElementById("cart-total-display");
    const discRow = document.getElementById("cart-discount-row");
    const discEl = document.getElementById("cart-discount-display");

    if (!list || !totalEl || !discRow || !discEl) return;

    list.innerHTML = "";
    const entries = Object.values(orderMap);

    if (entries.length === 0) {
      list.innerHTML = '<li class="cart-empty-msg">No items added yet.</li>';
    } else {
      entries.forEach(({ item, quantity }) => {
        const li = document.createElement("li");
        li.className = "cart-line";
        li.innerHTML =
          `<span class="cart-line-name">${item.name}</span>` +
          `<span class="cart-line-meta">` +
          `<span class="cart-line-qty">×${quantity}</span>` +
          `<span class="cart-line-price">$${(item.price * quantity).toFixed(2)}</span>` +
          `</span>`;
        list.appendChild(li);
      });
    }

    const finalTotal = Math.max(0, getCartSubtotal() - appliedDiscount);
    totalEl.textContent = "$" + finalTotal.toFixed(2);

    if (appliedDiscount > 0) {
      discRow.classList.add("visible");
      discEl.textContent = "−$" + appliedDiscount.toFixed(2);
    } else {
      discRow.classList.remove("visible");
    }
  }

  async function fetchMenu() {
    try {
      const res = await fetch("/api/menu");
      if (!res.ok) throw new Error("Server returned status " + res.status);

      const data = await res.json();
      allCategories = data.categories;
      renderMenu(allCategories);

    } catch (err) {
      const status = document.getElementById("status-message");
      if (status) {
        status.textContent = "Failed to load menu. Please refresh the page.";
      }
      console.error("Menu fetch error:", err);
    }
  }

  function renderMenu(categories) {
    const container = document.getElementById("menu-container");
    if (!container) return;

    container.innerHTML = "";

    const visible = categories.filter(cat => cat.items.length > 0);
    if (visible.length === 0) {
      container.innerHTML = '<p class="no-results">No items match your search.</p>';
      return;
    }

    visible.forEach(category => {
      const section = document.createElement("section");
      section.className = "category-section";

      const heading = document.createElement("h2");
      heading.className = "category-title";
      heading.textContent = category.name;
      section.appendChild(heading);

      const grid = document.createElement("div");
      grid.className = "items-grid";

      category.items.forEach(item => {
        grid.appendChild(buildCard(item));
      });

      section.appendChild(grid);
      container.appendChild(section);
    });
  }

  function buildPhotoEl(itemName) {
    const img = document.createElement("img");
    img.className = "item-photo";
    img.alt = itemName;

    const imageMap = {
      "Chicken Shawarma": "/static/images/shawarma.jpg.jpeg",
      "Falafel Wrap": "/static/images/falafel.jpg.jpeg",
      "Cola": "/static/images/cola.jpg.jpeg",
      "Fries": "/static/images/fries.jpg.jpeg"
    };

    img.src = imageMap[itemName] || "";

    img.onerror = function () {
      const ph = document.createElement("div");
      ph.className = "item-photo-placeholder";
      ph.textContent = "🍽️";
      img.replaceWith(ph);
    };

    return img;
  }

  function buildCard(item) {
    const card = document.createElement("div");
    card.className = "item-card" + (item.is_available ? "" : " unavailable");

    card.appendChild(buildPhotoEl(item.name));

    const body = document.createElement("div");
    body.className = "item-body";

    const name = document.createElement("p");
    name.className = "item-name";
    name.textContent = item.name;

    const price = document.createElement("p");
    price.className = "item-price";
    price.textContent = "$" + item.price.toFixed(2);

    const badge = document.createElement("span");
    badge.className = "badge " + (item.is_available ? "available" : "unavailable");
    badge.textContent = item.is_available ? "Available" : "Unavailable";

    body.appendChild(name);
    body.appendChild(price);
    body.appendChild(badge);

    if (item.is_available) {
      const qtyRow = document.createElement("div");
      qtyRow.className = "qty-row";

      const minusBtn = document.createElement("button");
      minusBtn.className = "qty-btn";
      minusBtn.textContent = "−";

      const qtyDisplay = document.createElement("span");
      qtyDisplay.className = "qty-display";
      qtyDisplay.textContent = "1";

      const plusBtn = document.createElement("button");
      plusBtn.className = "qty-btn";
      plusBtn.textContent = "+";

      minusBtn.addEventListener("click", function () {
        let q = parseInt(qtyDisplay.textContent);
        if (q > 1) qtyDisplay.textContent = q - 1;
      });

      plusBtn.addEventListener("click", function () {
        qtyDisplay.textContent = parseInt(qtyDisplay.textContent) + 1;
      });

      qtyRow.appendChild(minusBtn);
      qtyRow.appendChild(qtyDisplay);
      qtyRow.appendChild(plusBtn);

      const button = document.createElement("button");
      button.className = "btn-cart";
      button.textContent = "Add to Cart";

      button.addEventListener("click", async function () {
        const qty = parseInt(qtyDisplay.textContent);
        button.disabled = true;
        button.textContent = "Adding…";

        try {
          const res = await fetch("/api/cart/add", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              session_id: SESSION_ID,
              item_id: item.id,
              quantity: qty
            })
          });

          const data = await res.json();

          if (res.ok) {
            if (orderMap[item.id]) {
              orderMap[item.id].quantity += qty;
            } else {
              orderMap[item.id] = { item, quantity: qty };
            }

            renderCartPanel();
            showCartMessage(
              data.message + " | Cart Total: $" + data.cart_total.toFixed(2),
              "success"
            );
            qtyDisplay.textContent = "1";
          } else {
            showCartMessage(data.error || "Could not add item.", "error");
          }

        } catch (err) {
          showCartMessage("Failed to add item to cart. Please try again.", "error");
          console.error("Add to cart error:", err);

        } finally {
          button.disabled = false;
          button.textContent = "Add to Cart";
        }
      });

      body.appendChild(qtyRow);
      body.appendChild(button);

    } else {
      const button = document.createElement("button");
      button.className = "btn-cart";
      button.textContent = "Unavailable";
      button.disabled = true;
      body.appendChild(button);
    }

    card.appendChild(body);
    return card;
  }

  function initMenuPage() {
    const clearCartBtn = document.getElementById("clear-cart-btn");
    if (clearCartBtn) {
      clearCartBtn.addEventListener("click", function () {
        Object.keys(orderMap).forEach(k => delete orderMap[k]);
        appliedDiscount = 0;
        document.querySelectorAll(".qty-display").forEach(el => el.textContent = "1");
        renderCartPanel();

        const msg = document.getElementById("cart-message");
        if (msg) msg.className = "";
      });
    }

    const searchInput = document.getElementById("search-input");
    if (searchInput) {
      searchInput.addEventListener("input", function () {
        const query = this.value.trim().toLowerCase();

        if (query === "") {
          renderMenu(allCategories);
          return;
        }

        const filtered = allCategories.map(cat => ({
          name: cat.name,
          items: cat.items.filter(i => i.name.toLowerCase().includes(query))
        }));

        renderMenu(filtered);
      });
    }

    const applyPromoBtn = document.getElementById("apply-promo-btn");
    if (applyPromoBtn) {
      applyPromoBtn.addEventListener("click", async function () {
        const promoInput = document.getElementById("promo-input");
        const code = promoInput ? promoInput.value.trim() : "";

        if (!code) {
          showCartMessage("Please enter a promo code.", "error");
          return;
        }

        applyPromoBtn.disabled = true;
        applyPromoBtn.textContent = "Applying…";

        try {
          const res = await fetch("/api/promo/apply", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              session_id: SESSION_ID,
              code: code
            })
          });

          const data = await res.json();

          if (res.ok) {
            appliedDiscount = Number(data.discount_amount);

            showCartMessage(
              data.message + " | New Total: $" + Number(data.new_total).toFixed(2),
              "success"
            );

            renderCartPanel();

          } else {
            showCartMessage(data.error || "Invalid promo code. Please try again.", "error");
          }

        } catch (err) {
          showCartMessage("Failed to apply promo code. Please try again.", "error");
          console.error("Promo apply error:", err);

        } finally {
          applyPromoBtn.disabled = false;
          applyPromoBtn.textContent = "Apply Promo";
        }
      });
    }

    const checkoutBtn = document.getElementById("checkout-btn");
    if (checkoutBtn) {
      checkoutBtn.addEventListener("click", function () {
        if (Object.keys(orderMap).length === 0) {
          showCartMessage("Please add at least one item before checkout.", "error");
          return;
        }

        window.location.href = "/checkout";
      });
    }

    renderCartPanel();
    console.log("SCRIPT IS RUNNING");
    fetchMenu();
  }

  document.addEventListener("DOMContentLoaded", initMenuPage);
</script>

</body>
</html>
